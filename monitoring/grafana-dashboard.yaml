# The kube-prometheus-stack Grafana sidecar loads every ConfigMap labelled grafana_dashboard=1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mazehub-dashboard
  namespace: monitoring
  labels: {grafana_dashboard: "1"}
data:
  mazehub.json: |
    {
      "title": "MazeHub",
      "uid": "mazehub",
      "schemaVersion": 39,
      "time": {"from": "now-30m", "to": "now"},
      "panels": [
        {"type": "timeseries", "title": "Requests per second by handler", "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
         "targets": [{"expr": "sum by (handler) (rate(http_requests_total{job=\"mazehub-backend\"}[1m]))", "legendFormat": "{{handler}}"}]},
        {"type": "timeseries", "title": "p95 latency (s)", "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
         "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"mazehub-backend\"}[2m])))"}]},
        {"type": "timeseries", "title": "Pod memory (MiB)", "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
         "targets": [{"expr": "max by (pod) (container_memory_working_set_bytes{namespace=\"mazehub\",pod!=\"\"}) / 1024 / 1024", "legendFormat": "{{pod}}"}]},
        {"type": "stat", "title": "Backend targets up", "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
         "targets": [{"expr": "sum(up{job=\"mazehub-backend\"})"}]}
      ]
    }
