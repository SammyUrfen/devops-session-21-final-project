# Run from the repo root:  docker compose -f docker-compose.yml up --build
name: mazehub
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mazehub
      POSTGRES_USER: maze
      POSTGRES_PASSWORD: demo-password-not-real
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maze -d mazehub"]
      interval: 3s
      retries: 20
    volumes: [postgres-data:/var/lib/postgresql/data]
    mem_limit: 256m

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://maze:demo-password-not-real@postgres:5432/mazehub
      ENVIRONMENT: docker-compose
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8000:8000"]
    mem_limit: 256m

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:8080"]
    mem_limit: 128m

volumes:
  postgres-data:
