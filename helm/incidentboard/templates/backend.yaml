apiVersion: apps/v1
kind: Deployment
metadata:
  name: incidentboard-backend
  labels: {{- include "ib.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  selector: {matchLabels: {app: backend}}
  template:
    metadata:
      labels: {app: backend}
      annotations:
        # Roll the pods when the ConfigMap changes; env vars are read only at start-up.
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Without this wait, `alembic upgrade head` fails while Postgres starts and the pod restarts 1-2 times
        # (seen in CI run 37652264374). Same image as the DB, so the node already has it.
        - name: wait-for-db
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h incidentboard-postgres -p 5432; do sleep 2; done"]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 32Mi}}
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: incidentboard-config}
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: incidentboard-db, key: DATABASE_URL}}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true}
---
apiVersion: v1
kind: Service
metadata:
  name: incidentboard-backend
  labels:
    app: backend
    {{- include "ib.labels" . | nindent 4 }}
spec:
  selector: {app: backend}
  ports: [{name: http, port: 8000, targetPort: http}]
